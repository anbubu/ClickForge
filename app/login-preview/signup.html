<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClickForge — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <a class="wordmark" href="http://localhost:8099">Click<span>Forge</span></a>
    <div class="card">
      <span class="badge">Start free · 5 forges</span>
      <h1>Start forging for free</h1>
      <p class="sub">No card. Five free forges to see your first predicted CTR.</p>
      <form id="signupForm">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@studio.com" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
          <p class="hint">At least 8 characters.</p>
        </div>
        <button type="submit">Create account</button>
      </form>
      <p class="foot">Already have an account? <a href="index.html">Log in</a></p>
    </div>
    <p class="note">This is a local design preview — no backend is wired up</p>
  </div>
  <div class="toast" id="toast">This is a static preview — no account was created.</div>
  <script>
    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, 2400);
    });
  </script>
</body>
</html>
