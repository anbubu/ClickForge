<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--
      TODO(clickforge): set SITE_URL to the real canonical domain before launch.
      og:url and og:image have to be absolute URLs — relative paths are ignored by
      every crawler, so a placeholder domain here means no preview card renders.
    -->
    <title>ClickForge — Score the click before you record</title>
    <meta
      name="description"
      content="Paste a raw concept and get three scored title options, a first-three-second retention hook, and an exact thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <link rel="canonical" href="https://clickforge.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ff7a18" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClickForge" />
    <meta property="og:title" content="ClickForge — Score the click before you record" />
    <meta
      property="og:description"
      content="Three scored title options, a retention hook, and a thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <meta property="og:url" content="https://clickforge.com/" />
    <meta property="og:image" content="https://clickforge.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ClickForge — score the click before you record." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClickForge — Score the click before you record" />
    <meta
      name="twitter:description"
      content="Three scored title options, a retention hook, and a thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <meta name="twitter:image" content="https://clickforge.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClickForge",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "AI-powered CTR optimization for video creators: scored titles, retention hooks and thumbnail blueprints.",
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "0", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Creator", "price": "29", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Studio", "price": "99", "priceCurrency": "USD" }
        ]
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        Anti-flash for the gap before the bundle boots: the document sits under
        the app and would otherwise paint white. Scoped to :not([data-theme]) so
        it applies only until ThemeContext stamps the real theme — otherwise this
        hard-coded dark would fight light mode for the life of the page.
      */
      html:not([data-theme]),
      html:not([data-theme]) body,
      html:not([data-theme]) #root {
        background-color: #0b0a09;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]),
        html:not([data-theme]) body,
        html:not([data-theme]) #root {
          background-color: #f1ede6;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="padding: 48px; font-family: system-ui, sans-serif; color: #ffffff; background: #0b0a09">
        <h1>ClickForge — score the click before you record.</h1>
        <p>
          Paste a raw concept and get three scored title options, a first-three-second retention hook, and
          an exact thumbnail blueprint in under sixty seconds — each carrying a predicted CTR.
        </p>
        <p>This page needs JavaScript enabled.</p>
      </div>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
