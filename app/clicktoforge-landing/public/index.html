<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!--
      clicktoforge.com is the canonical domain. Every absolute URL below has to
      stay absolute: og:url and og:image are read by crawlers that never resolve
      a relative path, so a relative one here means no preview card renders at
      all. `npm run seo` generates the sitemap and robots file from the same
      origin, and SITE_URL overrides it for a preview deploy.
    -->
    <title>ClickToForge — Score the click before you record</title>
    <meta
      name="description"
      content="Paste a raw concept and get three scored title options, a first-three-second retention hook, and an exact thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <link rel="canonical" href="https://clicktoforge.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The canvas, not the accent: this paints the browser chrome, and an
         orange bar above a #101010 page reads as a rendering fault. -->
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClickToForge" />
    <meta property="og:title" content="ClickToForge — Score the click before you record" />
    <meta
      property="og:description"
      content="Three scored title options, a retention hook, and a thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <meta property="og:url" content="https://clicktoforge.com/" />
    <meta property="og:image" content="https://clicktoforge.com/og-image.png" />
    <!-- The file's real pixels, not the 1200x630 it is laid out at: the board
         is rendered at 2x so it stays sharp on a retina unfurl, and a scraper
         that trusts these tags over the file will letterbox it if they lie. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="ClickToForge — score the click before you record." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClickToForge — Score the click before you record" />
    <meta
      name="twitter:description"
      content="Three scored title options, a retention hook, and a thumbnail blueprint in under sixty seconds — each carrying a predicted CTR."
    />
    <meta name="twitter:image" content="https://clicktoforge.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClickToForge",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "AI-powered CTR optimization for video creators: scored titles, retention hooks and thumbnail blueprints.",
        "offers": [
          { "@type": "Offer", "name": "Starter", "price": "0", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Creator", "price": "29", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Studio", "price": "99", "priceCurrency": "USD" }
        ]
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /*
        Anti-flash for the gap before the bundle boots: the document sits under
        the app and would otherwise paint white.

        The light-scheme override that used to sit here went with light mode —
        the Factory system is dark by construction, so honouring
        prefers-color-scheme meant flashing #f1ede6 at a reader whose OS is set
        to light before repainting #101010 under them.
      */
      html,
      body,
      #root {
        background-color: #101010;
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="padding: 48px; font-family: system-ui, sans-serif; color: #ffffff; background: #101010">
        <h1>ClickToForge — score the click before you record.</h1>
        <p>
          Paste a raw concept and get three scored title options, a first-three-second retention hook, and
          an exact thumbnail blueprint in under sixty seconds — each carrying a predicted CTR.
        </p>
        <p>This page needs JavaScript enabled.</p>
      </div>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
